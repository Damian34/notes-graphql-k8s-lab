{{- if .Values.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler # This kind of manifest need to have installed metrics-server
metadata:
  name: {{ include "notes-api.fullname" . }}-hpa
  namespace: {{ .Values.namespace }}
  labels:
    {{ include "notes-api.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "notes-api.fullname" . }}
  minReplicas: {{ .Values.replicas }}
  maxReplicas: {{ .Values.replicasMax }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # scale with over % CPU
{{- end }}
