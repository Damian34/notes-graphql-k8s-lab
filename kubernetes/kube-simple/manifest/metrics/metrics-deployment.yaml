apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: metrics-server
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      containers:
        - name: metrics-server
          image: k8s.gcr.io/metrics-server/metrics-server:v0.6.3
          args:
            - --kubelet-insecure-tls
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --cert-dir=/tmp
          ports:
            - containerPort: 443
          volumeMounts:
            - name: metrics-server-storage
              mountPath: /tmp
      volumes:
        - name: metrics-server-storage
          persistentVolumeClaim:
            claimName: metrics-server-pvc
